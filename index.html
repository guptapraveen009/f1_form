<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
   <div id="form">
      <h1 class="formhead">FeedBack Form</h1>
      <form action="#" id="Main">
        <div class="input_items">
          <label for="name">Name : </label>
          <input type="text" placeholder="Enter your name...." id="name">
        </div>

        <div class="input_items">
          <label for="ph-no">Phone : </label>
          <input type="tel" placeholder="Enter your Phone Number...." id="ph-no">
        </div>

        <div class="input_items">
          <label for="email">E-Mail : </label>
          <input type="email" placeholder="Enter your E-mail...." id="email">
        </div>

        <div class="input_items">
          <label for="role">Role : </label>
          <select name="role" id="role">
            <option value="#">Select</option>
            <option value="Instructor">Instructor</option>
            <option value="Student">Student</option>
          </select>
        </div>

        <div class="input_items">
          <label for="textarea">FeedBack : </label>
         <textarea name="textarea" id="textarea" rows="4" cols="30"></textarea>
        </div>

      

      </form>
        
    </div>
     <div class="btn">

      <button value="submit" id="button">Submit</button>
    </div>
  </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
